<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#060a07">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="screamer generator — генератор скример-страниц из ссылки.">
    <title>screamer generator</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="shader.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <canvas id="shader" class="shader"></canvas>
    </div>

    <main class="page">
      <section class="intro" aria-labelledby="heading">
        <div class="generator">
          <h1 id="heading">screamer <span class="generator-name">generator</span></h1>
          <!-- Lucide icons: Link2 and WandSparkles. License: assets/LICENSE-lucide.txt -->
          <form id="form" autocomplete="off">
            <label class="sr-only" for="url">Ссылка на сайт</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M9 17H7A5 5 0 0 1 7 7h2"></path>
                <path d="M15 7h2a5 5 0 1 1 0 10h-2"></path>
                <path d="M8 12h8"></path>
              </svg>
              <input id="url" type="text" inputmode="url" spellcheck="false" placeholder="Ссылка на сайт" aria-describedby="msg" required>
            </div>
            <button type="submit" id="go" aria-label="Создать скример" title="Создать скример">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"></path>
                <path d="m14 7 3 3M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9"></path>
              </svg>
            </button>
          </form>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </div>
      </section>

    </main>
  </body>
</html>
